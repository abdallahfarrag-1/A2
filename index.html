<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تقطيع الفواكه - النسخة الواقعية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        .game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid #27272a;
        }

        canvas {
            background: radial-gradient(circle, #78350f 10%, #3f1502 80%, #1c0801 100%);
            display: block;
            cursor: crosshair;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 25px;
            color: #facc15;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="hud" id="scoreDisplay">النقاط: 0</div>
        <canvas id="gameCanvas" width="850" height="550"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("scoreDisplay");

        let score = 0;
        let entities = []; // الفواكه الكاملة والنصفية
        let slices = [];  // أثر السكين
        let isMouseDown = false;

        // أنواع الفواكه بتفاصيل واقعية
        const fruitTemplates = [
            { name: "watermelon", radius: 40, outer: "#15803d", inner: "#ef4444", seed: true },
            { name: "orange", radius: 30, outer: "#ea580c", inner: "#f97316", seed: false },
            { name: "apple", radius: 28, outer: "#16a34a", inner: "#4ade80", seed: true },
            { name: "lemon", radius: 25, outer: "#ca8a04", inner: "#facc15", seed: false }
        ];

        // إطلاق فاكهة جديدة
        function spawnFruit() {
            let template = fruitTemplates[Math.floor(Math.random() * fruitTemplates.length)];
            entities.push({
                isHalf: false,
                x: Math.random() * (canvas.width - 300) + 150,
                y: canvas.height + 50,
                vx: (Math.random() - 0.5) * 5,
                vy: -(Math.random() * 4 + 12),
                radius: template.radius,
                outer: template.outer,
                inner: template.inner,
                seed: template.seed,
                rotation: 0,
                vRot: (Math.random() - 0.5) * 0.08
            });
        }

        // تتبع حركة السكين (ماوس أو لمس)
        window.addEventListener("mousedown", (e) => { isMouseDown = true; addSlice(e); });
        window.addEventListener("mouseup", () => { isMouseDown = false; });
        window.addEventListener("mousemove", (e) => { if (isMouseDown) addSlice(e); });

        canvas.addEventListener("touchstart", (e) => { isMouseDown = true; addSlice(e.touches[0]); e.preventDefault(); });
        canvas.addEventListener("touchend", () => { isMouseDown = false; });
        canvas.addEventListener("touchmove", (e) => { if (isMouseDown) addSlice(e.touches[0]); e.preventDefault(); });

        function addSlice(e) {
            const rect = canvas.getBoundingClientRect();
            slices.push({
                x: e.clientX - rect.left,
                y: e.clientY - rect.top,
                life: 12
            });
        }

        function update() {
            // تحديث حركة الفواكه والأنصاف
            for (let i = entities.length - 1; i >= 0; i--) {
                let ent = entities[i];
                ent.x += ent.vx;
                ent.y += ent.vy;
                ent.vy += 0.38; // الجاذبية
                ent.rotation += ent.vRot;

                if (ent.y > canvas.height + 100) {
                    entities.splice(i, 1);
                }
            }

            // تحديث أثر السكين
            for (let i = slices.length - 1; i >= 0; i--) {
                slices[i].life--;
                if (slices[i].life <= 0) slices.splice(i, 1);
            }

            // فحص التقطيع بالسكين
            if (slices.length > 0) {
                let s = slices[slices.length - 1];
                for (let i = entities.length - 1; i >= 0; i--) {
                    let ent = entities[i];
                    if (!ent.isHalf && Math.hypot(s.x - ent.x, s.y - ent.y) < ent.radius) {
                        // تقطيع الفاكهة إلى نصفين واقعيين!
                        score += 10;
                        scoreDisplay.textContent = "النقاط: " + score;

                        // نصف أيسر
                        entities.push({
                            isHalf: true,
                            side: "left",
                            x: ent.x - 5,
                            y: ent.y,
                            vx: ent.vx - 3,
                            vy: ent.vy - 2,
                            radius: ent.radius,
                            outer: ent.outer,
                            inner: ent.inner,
                            rotation: ent.rotation,
                            vRot: -0.15
                        });

                        // نصف أيمن
                        entities.push({
                            isHalf: true,
                            side: "right",
                            x: ent.x + 5,
                            y: ent.y,
                            vx: ent.vx + 3,
                            vy: ent.vy - 2,
                            radius: ent.radius,
                            outer: ent.outer,
                            inner: ent.inner,
                            rotation: ent.rotation,
                            vRot: 0.15
                        });

                        entities.splice(i, 1);
                    }
                }
            }

            // توليد فواكه باستمرار
            if (Math.random() < 0.025) {
                spawnFruit();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم تأثيرات الخشب الخلفي
            ctx.strokeStyle = "rgba(0,0,0,0.2)";
            ctx.lineWidth = 3;
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // رسم الفواكه أو الأنصاف المقسمة
            for (let i = 0; i < entities.length; i++) {
                let ent = entities[i];
                ctx.save();
                ctx.translate(ent.x, ent.y);
                ctx.rotate(ent.rotation);

                if (!ent.isHalf) {
                    // فاكهة كاملة واقعية
                    ctx.fillStyle = ent.outer;
                    ctx.beginPath();
                    ctx.arc(0, 0, ent.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = "#111";
                    ctx.stroke();

                    // لمعة بريق خفيفة على الفاكهة
                    ctx.fillStyle = "rgba(255,255,255,0.25);";
                    ctx.beginPath();
                    ctx.arc(-8, -8, ent.radius * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // رسم نصف الفاكهة بدقة بعد القطع
                    ctx.beginPath();
                    if (ent.side === "left") {
                        ctx.arc(0, 0, ent.radius, Math.PI / 2, Math.PI * 1.5, false);
                    } else {
                        ctx.arc(0, 0, ent.radius, Math.PI * 1.5, Math.PI / 2, false);
                    }
                    ctx.closePath();
                    ctx.fillStyle = ent.outer;
                    ctx.fill();
                    ctx.stroke();

                    // الجزء الداخلي المقطوع (اللب)
                    ctx.fillStyle = ent.inner;
                    ctx.beginPath();
                    if (ent.side === "left") {
                        ctx.arc(0, 0, ent.radius - 5, Math.PI / 2, Math.PI * 1.5, false);
                    } else {
                        ctx.arc(0, 0, ent.radius - 5, Math.PI * 1.5, Math.PI / 2, false);
                    }
                    ctx.closePath();
                    ctx.fill();
                }

                ctx.restore();
            }

            // رسم أثر السكين الاحترافي المضيء
            if (slices.length > 1) {
                ctx.beginPath();
                ctx.moveTo(slices[0].x, slices[0].y);
                for (let i = 1; i < slices.length; i++) {
                    ctx.lineTo(slices[i].x, slices[i].y);
                }
                ctx.strokeStyle = "#38bdf8";
                ctx.lineWidth = 7;
                ctx.lineCap = "round";
                ctx.shadowColor = "#0ea5e9";
                ctx.shadowBlur = 20;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
