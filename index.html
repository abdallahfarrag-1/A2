<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تقطيع الفواكه 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050508;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        .game-container {
            position: relative;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid #1e293b;
        }

        canvas {
            /* خلفية عميقة تعطي إيحاء بالفضاء أو الطاولة ثلاثية الأبعاد */
            background: radial-gradient(circle at center, #2e1065 0%, #0f172a 70%, #020617 100%);
            display: block;
            cursor: crosshair;
        }

        .hud {
            position: absolute;
            top: 25px;
            left: 30px;
            color: #38bdf8;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="hud" id="scoreDisplay">النقاط: 0</div>
        <canvas id="gameCanvas" width="900" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("scoreDisplay");

        let score = 0;
        let entities = [];
        let slices = [];
        let isMouseDown = false;

        const fruitTypes = ["watermelon", "orange", "apple"];

        function spawnFruit() {
            let type = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
            entities.push({
                isHalf: false,
                type: type,
                x: Math.random() * (canvas.width - 300) + 150,
                y: canvas.height + 60,
                z: Math.random() * 200 - 100, // عمق ثلاثي الأبعاد
                vx: (Math.random() - 0.5) * 6,
                vy: -(Math.random() * 4 + 14),
                vz: (Math.random() - 0.5) * 2,
                radius: type === "watermelon" ? 55 : 42,
                rx: Math.random() * Math.PI,
                ry: Math.random() * Math.PI,
                rz: Math.random() * Math.PI,
                vrx: (Math.random() - 0.5) * 0.08,
                vry: (Math.random() - 0.5) * 0.08,
                vrz: (Math.random() - 0.5) * 0.08
            });
        }

        window.addEventListener("mousedown", (e) => { isMouseDown = true; addSlice(e); });
        window.addEventListener("mouseup", () => { isMouseDown = false; });
        window.addEventListener("mousemove", (e) => { if (isMouseDown) addSlice(e); });

        canvas.addEventListener("touchstart", (e) => { isMouseDown = true; addSlice(e.touches[0]); e.preventDefault(); });
        canvas.addEventListener("touchend", () => { isMouseDown = false; });
        canvas.addEventListener("touchmove", (e) => { if (isMouseDown) addSlice(e.touches[0]); e.preventDefault(); });

        function addSlice(e) {
            const rect = canvas.getBoundingClientRect();
            slices.push({ x: e.clientX - rect.left, y: e.clientY - rect.top, life: 10 });
        }

        function update() {
            for (let i = entities.length - 1; i >= 0; i--) {
                let ent = entities[i];
                ent.x += ent.vx;
                ent.y += ent.vy;
                ent.z += ent.vz;
                ent.vy += 0.42; // الجاذبية

                ent.rx += ent.vrx;
                ent.ry += ent.vry;
                ent.rz += ent.vrz;

                if (ent.y > canvas.height + 150) {
                    entities.splice(i, 1);
                }
            }

            for (let i = slices.length - 1; i >= 0; i--) {
                slices[i].life--;
                if (slices[i].life <= 0) slices.splice(i, 1);
            }

            if (slices.length > 0) {
                let s = slices[slices.length - 1];
                for (let i = entities.length - 1; i >= 0; i--) {
                    let ent = entities[i];
                    if (!ent.isHalf && Math.hypot(s.x - ent.x, s.y - ent.y) < ent.radius) {
                        score += 20;
                        scoreDisplay.textContent = "النقاط: " + score;

                        // نصف أيسر 3D
                        entities.push({
                            isHalf: true,
                            side: "left",
                            type: ent.type,
                            x: ent.x - 10,
                            y: ent.y,
                            z: ent.z,
                            vx: ent.vx - 5,
                            vy: ent.vy - 3,
                            vz: ent.vz,
                            radius: ent.radius,
                            rx: ent.rx, ry: ent.ry, rz: ent.rz,
                            vrx: -0.15, vry: 0.1, vrz: 0.05
                        });

                        // نصف أيمن 3D
                        entities.push({
                            isHalf: true,
                            side: "right",
                            type: ent.type,
                            x: ent.x + 10,
                            y: ent.y,
                            z: ent.z,
                            vx: ent.vx + 5,
                            vy: ent.vy - 3,
                            vz: ent.vz,
                            radius: ent.radius,
                            rx: ent.rx, ry: ent.ry, rz: ent.rz,
                            vrx: 0.15, vry: -0.1, vrz: -0.05
                        });

                        entities.splice(i, 1);
                    }
                }
            }

            if (Math.random() < 0.025) {
                spawnFruit();
            }
        }

        function draw3DFruit(ent) {
            ctx.save();
            ctx.translate(ent.x, ent.y);

            // حساب مقياس المنظور بناءً على العمق Z لجعلها تبدو ثلاثية الأبعاد حقاً
            let scale = 400 / (400 + ent.z);
            ctx.scale(scale, scale);

            // تدوير المجسم في المحاور الثلاثة
            ctx.rotate(ent.rz);

            let r = ent.radius;

            if (ent.type === "watermelon") {
                if (!ent.isHalf) {
                    // --- بطيخ مجسم 3D ---
                    let grad = ctx.createRadialGradient(-r/3, -r/3, 5, 0, 0, r);
                    grad.addColorStop(0, "#4ade80");
                    grad.addColorStop(0.5, "#15803d");
                    grad.addColorStop(1, "#052e16");
                    
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = "#022c22";
                    ctx.stroke();
                } else {
                    // --- نصف بطيخ مقطوع 3D مع إظهار التظليل واللب ---
                    ctx.beginPath();
                    if (ent.side === "left") ctx.arc(0, 0, r, Math.PI / 2, Math.PI * 1.5, false);
                    else ctx.arc(0, 0, r, Math.PI * 1.5, Math.PI / 2, false);
                    ctx.closePath();
                    ctx.fillStyle = "#14532d";
                    ctx.fill();
                    ctx.stroke();

                    // اللب الداخلي الأحمر مع تأثير تجسيم (Gradient)
                    let innerGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, r);
                    innerGrad.addColorStop(0, "#f87171");
                    innerGrad.addColorStop(0.8, "#dc2626");
                    innerGrad.addColorStop(1, "#991b1b");

                    ctx.fillStyle = innerGrad;
                    ctx.beginPath();
                    if (ent.side === "left") ctx.arc(0, 0, r - 8, Math.PI / 2, Math.PI * 1.5, false);
                    else ctx.arc(0, 0, r - 8, Math.PI * 1.5, Math.PI / 2, false);
                    ctx.closePath();
                    ctx.fill();
                }
            }
            else if (ent.type === "orange") {
                if (!ent.isHalf) {
                    let grad = ctx.createRadialGradient(-r/3, -r/3, 2, 0, 0, r);
                    grad.addColorStop(0, "#fb923c");
                    grad.addColorStop(0.6, "#ea580c");
                    grad.addColorStop(1, "#7c2d12");

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    if (ent.side === "left") ctx.arc(0, 0, r, Math.PI / 2, Math.PI * 1.5, false);
                    else ctx.arc(0, 0, r, Math.PI * 1.5, Math.PI / 2, false);
                    ctx.closePath();
                    ctx.fillStyle = "#c2410c";
                    ctx.fill();

                    ctx.fillStyle = "#fb923c";
                    ctx.beginPath();
                    if (ent.side === "left") ctx.arc(0, 0, r - 6, Math.PI / 2, Math.PI * 1.5, false);
                    else ctx.arc(0, 0, r - 6, Math.PI * 1.5, Math.PI / 2, false);
                    ctx.closePath();
                    ctx.fill();
                }
            }
            else if (ent.type === "apple") {
                if (!ent.isHalf) {
                    let grad = ctx.createRadialGradient(-r/3, -r/3, 2, 0, 0, r);
                    grad.addColorStop(0, "#4ade80");
                    grad.addColorStop(0.6, "#16a34a");
                    grad.addColorStop(1, "#14532d");

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    if (ent.side === "left") ctx.arc(0, 0, r, Math.PI / 2, Math.PI * 1.5, false);
                    else ctx.arc(0, 0, r, Math.PI * 1.5, Math.PI / 2, false);
                    ctx.closePath();
                    ctx.fillStyle = "#15803d";
                    ctx.fill();

                    ctx.fillStyle = "#fef08a";
                    ctx.beginPath();
                    if (ent.side === "left") ctx.arc(0, 0, r - 6, Math.PI / 2, Math.PI * 1.5, false);
                    else ctx.arc(0, 0, r - 6, Math.PI * 1.5, Math.PI / 2, false);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم خطوط الشبكة في الخلفية لإعطاء طابع ثلاثي الأبعاد للعمق
            ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 60) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            // ترتيب الفواكه حسب العمق (Z-index simulation) لتظهر بشكل ثلاثي الأبعاد حقيقي
            entities.sort((a, b) => a.z - b.z);

            for (let i = 0; i < entities.length; i++) {
                draw3DFruit(entities[i]);
            }

            // أثر السكين النيون المتوهج
            if (slices.length > 1) {
                ctx.beginPath();
                ctx.moveTo(slices[0].x, slices[0].y);
                for (let i = 1; i < slices.length; i++) {
                    ctx.lineTo(slices[i].x, slices[i].y);
                }
                ctx.strokeStyle = "#38bdf8";
                ctx.lineWidth = 10;
                ctx.lineCap = "round";
                ctx.shadowColor = "#0284c7";
                ctx.shadowBlur = 30;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
