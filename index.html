<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تقطيع الفواكه بمحرك Phaser.js</title>
    <!-- استدعاء مكتبة Phaser 3 من خلال CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            border: 4px solid #1e293b;
        }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <script>
        class FruitGame extends Phaser.Scene {
            constructor() {
                super('FruitGame');
            }

            preload() {
                // لعدم الحاجة لصور خارجية، سنقوم برسم الأشكال بـ Graphics داخل Phaser
            }

            create() {
                // خلفية خشبية داكنة فاخرة تشبه اللعبة الأصلية
                let bg = this.add.graphics();
                bg.fillGradientStyle(0x78350f, 0x78350f, 0x3f1502, 0x1c0801, 1);
                bg.fillRect(0, 0, 900, 600);

                // خطوط الطاولة الخشبية الخلفية
                bg.lineStyle(2, 0x000000, 0.2);
                for (let y = 0; y < 600; y += 40) {
                    bg.lineBetween(0, y, 900, y);
                }

                this.score = 0;
                this.scoreText = this.add.text(30, 25, 'النقاط: 0', {
                    fontSize: '36px',
                    fontFamily: 'Segoe UI',
                    color: '#facc15',
                    fontStyle: 'bold'
                });

                this.fruits = this.add.group();
                this.sliceTrail = [];
                this.isCutting = false;

                // تتبع حركة الماوس أو اللمس للتقطيع وأثر السكين
                this.input.on('pointerdown', (pointer) => {
                    this.isCutting = true;
                    this.sliceTrail = [{x: pointer.x, y: pointer.y}];
                });

                this.input.on('pointerup', () => {
                    this.isCutting = false;
                    this.sliceTrail = [];
                });

                this.input.on('pointermove', (pointer) => {
                    if (this.isCutting) {
                        this.sliceTrail.push({x: pointer.x, y: pointer.y});
                        if (this.sliceTrail.length > 10) this.sliceTrail.shift();
                        
                        // فحص التقطيع
                        this.checkSlice(pointer.x, pointer.y);
                    }
                });

                // إطلاق الفواكه بشكل دوري
                this.time.addEvent({
                    delay: 900,
                    callback: this.spawnFruit,
                    callbackScope: this,
                    loop: true
                });

                this.graphics = this.add.graphics();
            }

            spawnFruit() {
                let types = [
                    { name: 'watermelon', outer: 0x15803d, inner: 0xef4444, radius: 45 },
                    { name: 'orange', outer: 0xea580c, inner: 0xf97316, radius: 35 },
                    { name: 'apple', outer: 0x16a34a, inner: 0x4ade80, radius: 32 }
                ];
                let type = Phaser.Math.RND.pick(types);

                let x = Phaser.Math.Between(150, 750);
                let fruit = this.add.container(x, 650);

                let fGraphics = this.add.graphics();
                // رسم القشرة الخارجية
                fGraphics.fillStyle(type.outer, 1);
                fGraphics.fillCircle(0, 0, type.radius);
                fGraphics.lineStyle(3, 0x000000, 1);
                fGraphics.strokeCircle(0, 0, type.radius);

                // رسم اللب الداخلي
                fGraphics.fillStyle(type.inner, 1);
                fGraphics.fillCircle(0, 0, type.radius - 6);

                fruit.add(fGraphics);
                fruit.radius = type.radius;
                fruit.typeData = type;
                fruit.isHalf = false;

                // خصائص الفيزياء والحركة (تقفز للأعلى وتهبط بالجاذبية)
                fruit.vx = Phaser.Math.Between(-4, 4);
                fruit.vy = Phaser.Math.Between(-14, -11);
                fruit.vRot = Phaser.Math.FloatBetween(-0.05, 0.05);

                this.fruits.add(fruit);
            }

            checkSlice(x, y) {
                let children = this.fruits.getChildren();
                for (let i = children.length - 1; i >= 0; i--) {
                    let f = children[i];
                    if (!f.isHalf && Phaser.Math.Distance.Between(x, y, f.x, f.y) < f.radius) {
                        this.score += 15;
                        this.scoreText.setText('النقاط: ' + this.score);

                        // إنشاء نصفين متطايرين عند القطع
                        this.createHalf(f.x, f.y, f.typeData, 'left', f.vx - 4, f.vy - 2);
                        this.createHalf(f.x, f.y, f.typeData, 'right', f.vx + 4, f.vy - 2);

                        f.destroy();
                    }
                }
            }

            createHalf(x, y, type, side, vx, vy) {
                let half = this.add.container(x, y);
                let hGraphics = this.add.graphics();

                hGraphics.fillStyle(type.outer, 1);
                hGraphics.beginPath();
                if (side === 'left') {
                    hGraphics.arc(0, 0, type.radius, Math.PI / 2, Math.PI * 1.5, false);
                } else {
                    hGraphics.arc(0, 0, type.radius, Math.PI * 1.5, Math.PI / 2, false);
                }
                hGraphics.closePath();
                hGraphics.fillPath();
                hGraphics.strokePath();

                // اللب الداخلي للنصف
                hGraphics.fillStyle(type.inner, 1);
                hGraphics.beginPath();
                if (side === 'left') {
                    hGraphics.arc(0, 0, type.radius - 6, Math.PI / 2, Math.PI * 1.5, false);
                } else {
                    hGraphics.arc(0, 0, type.radius - 6, Math.PI * 1.5, Math.PI / 2, false);
                }
                hGraphics.closePath();
                hGraphics.fillPath();

                half.add(hGraphics);
                half.vx = vx;
                half.vy = vy;
                half.vRot = side === 'left' ? -0.15 : 0.15;
                half.isHalf = true;

                this.fruits.add(half);
            }

            update() {
                this.graphics.clear();

                // تحديث حركات جميع الفواكه والأنصاف فيزيائياً
                let children = this.fruits.getChildren();
                for (let i = children.length - 1; i >= 0; i--) {
                    let f = children[i];
                    f.x += f.vx;
                    f.y += f.vy;
                    f.vy += 0.42; // الجاذبية
                    f.rotation += f.vRot;

                    if (f.y > 700) {
                        f.destroy();
                    }
                }

                // رسم أثر السكين المتوهج النيون
                if (this.sliceTrail.length > 1) {
                    this.graphics.lineStyle(8, 0x38bdf8, 0.9);
                    this.graphics.beginPath();
                    this.graphics.moveTo(this.sliceTrail[0].x, this.sliceTrail[0].y);
                    for (let i = 1; i < this.sliceTrail.length; i++) {
                        this.graphics.lineTo(this.sliceTrail[i].x, this.sliceTrail[i].y);
                    }
                    this.graphics.strokePath();
                }
            }
        }

        const config = {
            type: Phaser.AUTO,
            width: 900,
            height: 600,
            parent: 'game-container',
            scene: FruitGame
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
