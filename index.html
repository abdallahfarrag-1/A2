<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق تراث - Turath App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- خط تجوال العربي من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emeraldCustom: '#064e3b', // أخضر تراثي غامق
                        emeraldLight: '#10b981',  // أخضر فاتح للتأثيرات
                    },
                    fontFamily: {
                        tajawal: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-stone-50 font-tajawal min-h-screen flex items-center justify-center p-4">

    <!-- Screen 1: Auth Screen (Login & Register) -->
    <div id="authScreen" class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-emerald-100">
        <!-- Header / Logo Area -->
        <div class="bg-emerald-900 text-white p-8 text-center relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-emerald-800 rounded-full opacity-50"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-emerald-800 rounded-full opacity-50"></div>
            
            <!-- أيقونة / شعار تراث -->
            <div class="inline-flex items-center justify-center w-20 h-20 bg-white text-emerald-900 rounded-full shadow-lg mb-3 relative z-10 border-4 border-emerald-100">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0h4m-4 0H7m4 0v10"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold tracking-wide relative z-10">تُـــراث</h1>
            <p class="text-emerald-200 text-sm mt-1 relative z-10">أصالة الماضي بلمسة الحديث</p>
        </div>

        <!-- Form Container -->
        <div class="p-6 sm:p-8">
            <!-- Tabs Toggle -->
            <div class="flex bg-emerald-50 rounded-xl p-1 mb-6 border border-emerald-100">
                <button id="loginTabBtn" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-bold rounded-lg text-emerald-900 bg-white shadow transition-all">
                    تسجيل الدخول
                </button>
                <button id="registerTabBtn" onclick="switchTab('register')" class="flex-1 py-2 text-sm font-bold rounded-lg text-emerald-700 hover:text-emerald-900 transition-all">
                    حساب جديد
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-emerald-900 mb-1">البريد الإلكتروني / اسم المستخدم</label>
                    <input type="text" required placeholder="example@turath.com" class="w-full px-4 py-3 rounded-lg bg-emerald-50/50 border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:bg-white transition-all text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-emerald-900 mb-1">كلمة المرور</label>
                    <input type="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-lg bg-emerald-50/50 border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:bg-white transition-all text-sm">
                </div>
                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center text-gray-600 cursor-pointer">
                        <input type="checkbox" class="rounded border-emerald-300 text-emerald-800 focus:ring-emerald-700 ml-1.5">
                        تذكرني
                    </label>
                    <a href="#" class="text-emerald-800 hover:underline font-bold">نسيت كلمة المرور؟</a>
                </div>
                <button type="submit" class="w-full py-3.5 bg-emerald-900 hover:bg-emerald-800 text-white font-bold rounded-lg shadow-md hover:shadow-lg transition-all text-sm">
                    دخول
                </button>
            </form>

            <!-- Register Form (Hidden by default) -->
            <form id="registerForm" onsubmit="handleAuth(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-emerald-900 mb-1">الاسم الكامل</label>
                    <input type="text" required placeholder="أحمد المحمد" class="w-full px-4 py-3 rounded-lg bg-emerald-50/50 border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:bg-white transition-all text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-emerald-900 mb-1">البريد الإلكتروني</label>
                    <input type="email" required placeholder="example@turath.com" class="w-full px-4 py-3 rounded-lg bg-emerald-50/50 border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:bg-white transition-all text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-emerald-900 mb-1">كلمة المرور</label>
                    <input type="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-lg bg-emerald-50/50 border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:bg-white transition-all text-sm">
                </div>
                <button type="submit" class="w-full py-3.5 bg-emerald-900 hover:bg-emerald-800 text-white font-bold rounded-lg shadow-md hover:shadow-lg transition-all text-sm">
                    إنشاء حساب جديد
                </button>
            </form>
        </div>
    </div>

    <!-- Screen 2: Empty Dashboard/Main Screen (Hidden initially) -->
    <div id="mainScreen" class="w-full max-w-4xl bg-white rounded-2xl shadow-xl min-h-[500px] hidden flex-col border border-emerald-100 overflow-hidden">
        <!-- Main Screen Header -->
        <header class="bg-emerald-900 text-white px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 bg-white text-emerald-900 rounded-full flex items-center justify-center font-bold">
                    ت
                </div>
                <span class="font-bold text-lg">تطبيق تراث</span>
            </div>
            <button onclick="logout()" class="text-xs bg-emerald-800 hover:bg-emerald-700 px-3 py-2 rounded-lg transition-all border border-emerald-700">
                تسجيل الخروج
            </button>
        </header>

        <!-- Main Empty Content -->
        <main class="flex-1 p-8 flex flex-col items-center justify-center text-center">
            <div class="w-24 h-24 bg-emerald-50 rounded-full flex items-center justify-center text-emerald-800 mb-4 border border-emerald-200">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-emerald-900 mb-2">الواجهة الرئيسية (فاضية)</h2>
            <p class="text-gray-500 max-w-md text-sm leading-relaxed">
                مرحباً بك في تطبيق تُراث! يمكنك الآن البدء في إضافة العناصر والمحتوى الخاص بك هنا.
            </p>
        </main>
    </div>

    <!-- JavaScript For Switching Tabs & Screens -->
    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginBtn = document.getElementById('loginTabBtn');
            const registerBtn = document.getElementById('registerTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                
                loginBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg text-emerald-900 bg-white shadow transition-all";
                registerBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg text-emerald-700 hover:text-emerald-900 transition-all";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');

                registerBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg text-emerald-900 bg-white shadow transition-all";
                loginBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg text-emerald-700 hover:text-emerald-900 transition-all";
            }
        }

        function handleAuth(event) {
            event.preventDefault();
            // الانتقال للشاشة الثانية
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            document.getElementById('mainScreen').classList.add('flex');
        }

        function logout() {
            // العودة لشاشة التسجيل
            document.getElementById('mainScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('flex');
            document.getElementById('authScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
