<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تقطيع الفواكه - Fruit Slice</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121214;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        .game-container {
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            border-radius: 15px;
            overflow: hidden;
            border: 4px solid #3f3f46;
        }

        canvas {
            /* خلفية خشبية واقعية تشبه اللعبة الأصلية */
            background: radial-gradient(circle, #854d0e 20%, #451a03 90%);
            display: block;
            cursor: crosshair;
        }

        .score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="score-board" id="scoreBoard">النقاط: 0</div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreBoard = document.getElementById("scoreBoard");

        let score = 0;
        let fruits = [];
        let slices = []; // لتتبع آثار السكين أو الإصبع
        let isMouseDown = false;

        // مصفوفة أنواع الفواكه وألوانها
        const fruitTypes = [
            { name: "بطيخ", color: "#ef4444", outerColor: "#15803d", radius: 35 },
            { name: "برتقال", color: "#f97316", outerColor: "#ea580c", radius: 28 },
            { name: "تفاح", color: "#22c55e", outerColor: "#15803d", radius: 25 },
            { name: "موز", color: "#eab308", outerColor: "#ca8a04", radius: 22 }
        ];

        // توليد فاكهة جديدة تطير للأعلى
        function spawnFruit() {
            let type = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
            let fruit = {
                x: Math.random() * (canvas.width - 200) + 100,
                y: canvas.height + 40,
                vx: (Math.random() - 0.5) * 6,
                vy: -(Math.random() * 4 + 11), // قوة القفز للأعلى
                radius: type.radius,
                color: type.color,
                outerColor: type.outerColor,
                sliced: false,
                rotation: 0,
                vRot: (Math.random() - 0.5) * 0.1
            };
            fruits.push(fruit);
        }

        // تتبع حركة الفأرة أو اللمس للتقطيع
        window.addEventListener("mousedown", (e) => { isMouseDown = true; addSlicePoint(e); });
        window.addEventListener("mouseup", () => { isMouseDown = false; });
        window.addEventListener("mousemove", (e) => { if (isMouseDown) addSlicePoint(e); });

        // دعم الموبايل باللمس
        canvas.addEventListener("touchstart", (e) => { isMouseDown = true; addSlicePoint(e.touches[0]); e.preventDefault(); });
        canvas.addEventListener("touchend", () => { isMouseDown = false; });
        canvas.addEventListener("touchmove", (e) => { if (isMouseDown) addSlicePoint(e.touches[0]); e.preventDefault(); });

        function addSlicePoint(e) {
            const rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            slices.push({ x: x, y: y, life: 10 }); // عمر خط التقطيع يختفي سريعا
        }

        function update() {
            // تحديث الفواكه وحركتها الفيزيائية (جاذبية)
            for (let i = fruits.length - 1; i >= 0; i--) {
                let f = fruits[i];
                f.x += f.vx;
                f.y += f.vy;
                f.vy += 0.35; // الجاذبية تسحبها لأسفل
                f.rotation += f.vRot;

                // إزالة الفاكهة إذا خرجت من الشاشة
                if (f.y > canvas.height + 60) {
                    fruits.splice(i, 1);
                }
            }

            // تحديث خطوط السكين
            for (let i = slices.length - 1; i >= 0; i--) {
                slices[i].life--;
                if (slices[i].life <= 0) {
                    slices.splice(i, 1);
                }
            }

            // فحص التقاطع والتقطيع (إذا لامس خط السكين الفاكهة)
            if (slices.length > 0) {
                let currentSlice = slices[slices.length - 1];
                for (let i = fruits.length - 1; i >= 0; i--) {
                    let f = fruits[i];
                    let dist = Math.hypot(currentSlice.x - f.x, currentSlice.y - f.y);
                    if (dist < f.radius && !f.sliced) {
                        f.sliced = true;
                        score += 10;
                        scoreBoard.textContent = "النقاط: " + score;
                        // إزالة الفاكهة عند تقطيعها وإضافة تأثير بسيط
                        fruits.splice(i, 1);
                    }
                }
            }

            // إطلاق فواكه عشوائية كل فترة
            if (Math.random() < 0.03) {
                spawnFruit();
            }
        }

        function draw() {
            // مسح الشاشة ورسم خلفية خشبية مزخرفة
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم خطوط خشبية أفقية خفيفة لإعطاء مظهر طاولة المطبخ
            ctx.strokeStyle = "rgba(0,0,0,0.15)";
            ctx.lineWidth = 2;
            for(let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // رسم الفواكه المتطايرة
            for (let i = 0; i < fruits.length; i++) {
                let f = fruits[i];
                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.rotate(f.rotation);

                // رسم قشرة الفاكهة الخارجية
                ctx.fillStyle = f.outerColor;
                ctx.beginPath();
                ctx.arc(0, 0, f.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#000";
                ctx.stroke();

                // رسم من الداخل (لب الفاكهة)
                ctx.fillStyle = f.color;
                ctx.beginPath();
                ctx.arc(0, 0, f.radius - 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // رسم أثر السكين البراق (Blade Trail)
            if (slices.length > 1) {
                ctx.beginPath();
                ctx.moveTo(slices[0].x, slices[0].y);
                for (let i = 1; i < slices.length; i++) {
                    ctx.lineTo(slices[i].x, slices[i].y);
                }
                ctx.strokeStyle = "#38bdf8"; // لون شرارة البرق أو السكين
                ctx.lineWidth = 6;
                ctx.lineCap = "round";
                ctx.shadowColor = "#38bdf8";
                ctx.shadowBlur = 15;
                ctx.stroke();
                ctx.shadowBlur = 0; // إعادة ضبط
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
