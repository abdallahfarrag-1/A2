<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة القفز فوق الحواجز - HTML5 & JS</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .game-container {
            text-align: center;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            border: 3px solid #334155;
        }
        canvas {
            background: linear-gradient(to bottom, #38bdf8, #bae6fd);
            border-radius: 10px;
            display: block;
            margin: 0 auto;
            cursor: pointer;
        }
        .score-board {
            color: #facc15;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .instructions {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="score-board">النقاط: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="800" height="300"></canvas>
        <div class="instructions">اضغط على زر <b>المسافة (Space)</b> أو انقر بالشاشة للقفز!</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        // خصائص اللاعب (البطل المكعب)
        let player = {
            x: 80,
            y: 200,
            width: 35,
            height: 35,
            dy: 0,
            jumpForce: -11,
            gravity: 0.6,
            grounded: false,
            color: "#ef4444"
        };

        // خصائص الحاجز
        let obstacle = {
            x: 800,
            y: 205,
            width: 25,
            height: 45,
            speed: 6,
            color: "#0f172a"
        };

        let score = 0;
        let isGameOver = false;

        // التحكم بالقفز عبر لوحة المفاتيح أو النقر
        document.addEventListener("keydown", function(e) {
            if (e.code === "Space") {
                triggerJump();
            }
        });

        canvas.addEventListener("click", function() {
            triggerJump();
        });

        function triggerJump() {
            if (player.grounded) {
                player.dy = player.jumpForce;
                player.grounded = false;
            }
            if (isGameOver) {
                resetGame();
            }
        }

        function resetGame() {
            score = 0;
            obstacle.x = 800;
            obstacle.speed = 6;
            isGameOver = false;
            loop();
        }

        function update() {
            if (isGameOver) return;

            // حركة الجاذبية للعب
            player.dy += player.gravity;
            player.y += player.dy;

            // الارتطام بالأرض
            if (player.y > 200) {
                player.y = 200;
                player.dy = 0;
                player.grounded = true;
            }

            // حركة الحاجز نحو اليمين لليسار
            obstacle.x -= obstacle.speed;
            if (obstacle.x < -30) {
                obstacle.x = 800;
                score += 10;
                scoreElement.innerText = score;
                // زيادة السرعة تدريجياً مع زيادة النقاط
                obstacle.speed += 0.3;
            }

            // فحص التصادم (Collision Detection)
            if (
                player.x < obstacle.x + obstacle.width &&
                player.x + player.width > obstacle.x &&
                player.y < obstacle.y + obstacle.height &&
                player.y + player.height > obstacle.y
            ) {
                isGameOver = true;
            }
        }

        function draw() {
            // مسح الشاشة
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم الأرضية
            ctx.fillStyle = "#047857";
            ctx.fillRect(0, 235, canvas.width, 65);

            // رسم خط فاصل للأرض
            ctx.fillStyle = "#065f46";
            ctx.fillRect(0, 235, canvas.width, 6);

            // رسم اللاعب
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            // إضافة تفاصيل صغيرة للاعب (عينين)
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(player.x + 20, player.y + 8, 6, 6);

            // رسم الحاجز
            ctx.fillStyle = obstacle.color;
            ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

            // رسالة خسارة اللعبة
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 28px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillText("انتهت اللعبة!", canvas.width / 2, canvas.height / 2 - 15);

                ctx.font = "16px 'Segoe UI'";
                ctx.fillStyle = "#38bdf8";
                ctx.fillText("انقر أو اضغط مسافة لإعادة المحاولة", canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function loop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(loop);
            }
        }

        // بدء اللعبة
        loop();
    </script>
</body>
</html>
